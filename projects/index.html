<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Yoonkyong Lee</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body>
    <nav>
        <a href="../">Home</a>
        <a href="../projects/" aria-current="page">Projects</a>
        <a href="../resume/">Resume</a>
        <a href="../contact/">Contact</a>
        <a href="https://github.com/febyoon03" target="_blank">GitHub</a>
    </nav>
    <main>
        <h1>Projects</h1>
        <p>Click a card for the full write-up.</p>

        <h2>Space &amp; Aerospace</h2>
        <div class="project-grid" id="space-grid"></div>

        <h2>Software &amp; Data</h2>
        <div class="project-grid" id="software-grid"></div>

        <dialog id="project-detail">
            <div class="dialog-head">
                <h2 id="dialog-title" style="border:none; padding:0; margin:0;"></h2>
                <button class="dialog-close" id="dialog-close" aria-label="Close">&times;</button>
            </div>
            <div class="dialog-tags">
                <span id="dialog-category" class="tag"></span>
            </div>
            <p class="meta" id="dialog-meta"></p>
            <p class="badge" id="dialog-badge"></p>
            <div class="dialog-body" id="dialog-body"></div>
            <div class="dialog-links" id="dialog-links"></div>
        </dialog>
    </main>
</body>
</html>
